[project]
name = "auto-road-2"
version = "0.1.0"
description = "Height Area Graphs for automated preliminary road alignment: code and results of the article"
readme = "README.md"
authors = [
    { name = "Ioana-Alexandra Șomîtcă" },
    { name = "Ștefan-Eduard Deaconu" },
]
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSES/CC-BY-4.0.txt"]
# CPython 3.14 FREE-THREADED (python3.14t, PEP 703): `.python-version` selects it for uv.
requires-python = ">=3.14,<3.15"
# Pinned to the versions the results were produced with (requirements.txt is generated from
# uv.lock and kept for the pip path of setup_venv.*; tests/test_uv_lock.py keeps them equal).
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]

[project.urls]
Repository = "https://github.com/stefaneduard-deaconu/auto-road-2"
Issues = "https://github.com/stefaneduard-deaconu/auto-road-2/issues"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # the C/C++ compiler for core/native (a py3-none wheel, so --no-build still works)
    "ziglang==0.16.0",
]
# Optional: exact physical-core and memory readings for the parallel runner
# (core/parallel.py works without it). Install with `uv sync --group parallel`.
parallel = [
    "psutil>=7",
]

[tool.uv]
# The repository is a set of modules run from its root (`python -m core.run ...`), not an
# installable package.
package = false
default-groups = ["dev"]
